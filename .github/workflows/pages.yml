name: Build Google MP3 and deploy quiz
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gTTS==2.5.4
      - uses: actions/cache@v4
        with:
          path: audio
          key: google-us-mp3-${{ hashFiles('scripts/voice-texts.json', 'scripts/generate_audio.py') }}
      - run: python scripts/generate_audio.py
      - run: |
          mkdir -p dist
          cp scripts/site.html dist/index.html
          cp -r audio dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published homepage and every MP3 over HTTPS
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, json, time, urllib.request
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          for attempt in range(12):
              try:
                  html = urllib.request.urlopen(base + '?audio-build=mp3-fix-v2', timeout=30).read().decode()
                  assert 'mp3-fix-v2' in html, 'Previous homepage still cached'
                  for item in json.load(open('scripts/voice-texts.json')):
                      for kind in ('verb', 'phrase', 'sentence'):
                          response = urllib.request.urlopen(base + 'audio/' + item['id'] + '-' + kind + '.mp3', timeout=30)
                          data = response.read()
                          assert len(data) > 500, 'Missing or empty MP3'
                          assert data.startswith(b'ID3') or data[0] == 255, 'Invalid MP3 header'
                  print('Live homepage and all 54 MP3 files verified over HTTPS')
                  break
              except Exception:
                  if attempt == 11: raise
                  time.sleep(10)
          PY
